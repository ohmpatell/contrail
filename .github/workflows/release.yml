# Builds a signed release APK on every push to the main branch and attaches it to a
# GitHub Release, so Obtainium on the phone can offer it as an update.
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   CONTRAIL_KEYSTORE_BASE64   the release keystore, base64-encoded
#   CONTRAIL_KEYSTORE_PASSWORD the keystore password
#   CONTRAIL_KEY_ALIAS         the key alias inside the keystore
#   CONTRAIL_KEY_PASSWORD      the key password
# Without them the workflow still runs the tests, then skips the release with a warning.
name: Release APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTRAIL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit and screenshot tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CONTRAIL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set yet, so no release was published. See docs/STATUS.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/contrail-release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          CONTRAIL_KEYSTORE_PATH: ${{ runner.temp }}/contrail-release.jks
          CONTRAIL_KEYSTORE_PASSWORD: ${{ secrets.CONTRAIL_KEYSTORE_PASSWORD }}
          CONTRAIL_KEY_ALIAS: ${{ secrets.CONTRAIL_KEY_ALIAS }}
          CONTRAIL_KEY_PASSWORD: ${{ secrets.CONTRAIL_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "contrail-0.1.${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Contrail 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: contrail-0.1.${{ github.run_number }}.apk

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/contrail-release.jks"
